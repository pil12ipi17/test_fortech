groups:
  - name: task-management-observability
    rules:
      - alert: HighApi5xxRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API 5xx rate"
          description: "More than 5% of API requests are returning 5xx for 5 minutes."

      - alert: HighApiP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service, endpoint)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API p95 latency"
          description: "p95 latency is above 1 second for 10 minutes."

      - alert: ConsumerErrorsOrDlqGrowing
        expr: |
          sum(increase(worker_errors_total[5m])) > 0
          or
          sum(event_pipeline_dlq_messages) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer errors or DLQ activity detected"
          description: "Worker errors or DLQ messages were observed during the last 5 minutes."