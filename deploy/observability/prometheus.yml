global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Application and event-worker metrics endpoints.
  - job_name: task-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - task-service:8002

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:8001
  - job_name: event-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - outbox-publisher:9100
          - enrichment-service:9100
          - notification-worker:9100
          - audit-worker:9100
