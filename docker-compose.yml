services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data

  task-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"
    volumes:
      - task_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://auth_user:auth_password@auth-db:5432/auth_db
      AUTH_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: 120
    depends_on:
      auth-db:
        condition: service_healthy

  task-service:
    build:
      context: .
      dockerfile: services/task_service/Dockerfile
    environment:
      TASK_DATABASE_URL: postgresql+psycopg://task_user:task_password@task-db:5432/task_db
      TASK_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
    depends_on:
      task-db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      auth-service:
        condition: service_started
      task-service:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  auth_data:
  task_data: