services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data

  task-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"
    volumes:
      - task_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-task_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-task_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-task-system}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://auth_user:auth_password@auth-db:5432/auth_db
      AUTH_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: 120
      AUTH_REDIS_URL: ${AUTH_REDIS_URL:-redis://redis:6379/0}
      AUTH_LOGIN_RATE_LIMIT_REQUESTS: ${AUTH_LOGIN_RATE_LIMIT_REQUESTS:-5}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      auth-db:
        condition: service_healthy

  task-service:
    build:
      context: .
      dockerfile: services/task_service/Dockerfile
    environment:
      TASK_DATABASE_URL: postgresql+psycopg://task_user:task_password@task-db:5432/task_db
      TASK_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
      TASK_RABBITMQ_URL: ${TASK_RABBITMQ_URL:-amqp://task_user:task_password@rabbitmq:5672/task-system}
      TASK_RABBITMQ_TASKS_EXCHANGE: ${TASK_RABBITMQ_TASKS_EXCHANGE:-tasks.events}
      TASK_WORKER_MAX_RETRY_ATTEMPTS: ${TASK_WORKER_MAX_RETRY_ATTEMPTS:-3}
      TASK_REDIS_URL: ${TASK_REDIS_URL:-redis://redis:6379/0}
      TASK_TASK_CACHE_TTL_SECONDS: ${TASK_TASK_CACHE_TTL_SECONDS:-90}
      TASK_TASK_WRITE_RATE_LIMIT_REQUESTS: ${TASK_TASK_WRITE_RATE_LIMIT_REQUESTS:-30}
      TASK_TASK_WRITE_RATE_LIMIT_WINDOW_SECONDS: ${TASK_TASK_WRITE_RATE_LIMIT_WINDOW_SECONDS:-60}
      TASK_AUTH_DATABASE_URL: ${TASK_AUTH_DATABASE_URL:-postgresql+psycopg://auth_user:auth_password@auth-db:5432/auth_db}
      TASK_AUDIT_REPORT_PATH: ${TASK_AUDIT_REPORT_PATH:-/app/reports/audit_report.csv}
    volumes:
      - ./reports:/app/reports
    depends_on:
      task-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/readiness', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  outbox-publisher:
    build:
      context: .
      dockerfile: services/task_service/Dockerfile
    command: ["python", "-m", "services.task_service.app.messaging.outbox_publisher"]
    environment:
      TASK_DATABASE_URL: postgresql+psycopg://task_user:task_password@task-db:5432/task_db
      TASK_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
      TASK_RABBITMQ_URL: ${TASK_RABBITMQ_URL:-amqp://task_user:task_password@rabbitmq:5672/task-system}
      TASK_RABBITMQ_TASKS_EXCHANGE: ${TASK_RABBITMQ_TASKS_EXCHANGE:-tasks.events}
      TASK_WORKER_MAX_RETRY_ATTEMPTS: ${TASK_WORKER_MAX_RETRY_ATTEMPTS:-3}
      TASK_OUTBOX_PUBLISH_BATCH_SIZE: ${TASK_OUTBOX_PUBLISH_BATCH_SIZE:-50}
      TASK_OUTBOX_PUBLISH_POLL_INTERVAL_SECONDS: ${TASK_OUTBOX_PUBLISH_POLL_INTERVAL_SECONDS:-2}
    depends_on:
      task-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      task-service:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    command: ["python", "-m", "services.notification_service.app.worker"]
    environment:
      TASK_DATABASE_URL: postgresql+psycopg://task_user:task_password@task-db:5432/task_db
      TASK_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
      TASK_RABBITMQ_URL: ${TASK_RABBITMQ_URL:-amqp://task_user:task_password@rabbitmq:5672/task-system}
      TASK_RABBITMQ_TASKS_EXCHANGE: ${TASK_RABBITMQ_TASKS_EXCHANGE:-tasks.events}
      TASK_WORKER_MAX_RETRY_ATTEMPTS: ${TASK_WORKER_MAX_RETRY_ATTEMPTS:-3}
      TASK_WORKER_RETRY_BACKOFF_BASE_SECONDS: ${TASK_WORKER_RETRY_BACKOFF_BASE_SECONDS:-1}
      TASK_WORKER_RETRY_BACKOFF_MAX_SECONDS: ${TASK_WORKER_RETRY_BACKOFF_MAX_SECONDS:-10}
    depends_on:
      task-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      task-service:
        condition: service_healthy

  enrichment-service:
    build:
      context: .
      dockerfile: services/enrichment_service/Dockerfile
    command: ["python", "-m", "services.enrichment_service.app.worker"]
    environment:
      TASK_DATABASE_URL: postgresql+psycopg://task_user:task_password@task-db:5432/task_db
      TASK_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
      TASK_RABBITMQ_URL: ${TASK_RABBITMQ_URL:-amqp://task_user:task_password@rabbitmq:5672/task-system}
      TASK_RABBITMQ_TASKS_EXCHANGE: ${TASK_RABBITMQ_TASKS_EXCHANGE:-tasks.events}
      TASK_WORKER_MAX_RETRY_ATTEMPTS: ${TASK_WORKER_MAX_RETRY_ATTEMPTS:-3}
      TASK_WORKER_RETRY_BACKOFF_BASE_SECONDS: ${TASK_WORKER_RETRY_BACKOFF_BASE_SECONDS:-1}
      TASK_WORKER_RETRY_BACKOFF_MAX_SECONDS: ${TASK_WORKER_RETRY_BACKOFF_MAX_SECONDS:-10}
    depends_on:
      task-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      task-service:
        condition: service_healthy

  notification-cron:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    command: ["python", "-m", "services.notification_service.app.cron"]
    environment:
      TASK_DATABASE_URL: postgresql+psycopg://task_user:task_password@task-db:5432/task_db
      TASK_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
      TASK_NOTIFICATION_DISPATCH_INTERVAL_SECONDS: ${TASK_NOTIFICATION_DISPATCH_INTERVAL_SECONDS:-60}
      TASK_NOTIFICATION_DISPATCH_BATCH_SIZE: ${TASK_NOTIFICATION_DISPATCH_BATCH_SIZE:-50}
    depends_on:
      task-db:
        condition: service_healthy
      task-service:
        condition: service_healthy

  audit-worker:
    build:
      context: .
      dockerfile: services/audit_service/Dockerfile
    command: ["python", "-m", "services.audit_service.app.worker"]
    environment:
      TASK_DATABASE_URL: postgresql+psycopg://task_user:task_password@task-db:5432/task_db
      TASK_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
      TASK_RABBITMQ_URL: ${TASK_RABBITMQ_URL:-amqp://task_user:task_password@rabbitmq:5672/task-system}
      TASK_RABBITMQ_TASKS_EXCHANGE: ${TASK_RABBITMQ_TASKS_EXCHANGE:-tasks.events}
      TASK_WORKER_MAX_RETRY_ATTEMPTS: ${TASK_WORKER_MAX_RETRY_ATTEMPTS:-3}
      TASK_WORKER_RETRY_BACKOFF_BASE_SECONDS: ${TASK_WORKER_RETRY_BACKOFF_BASE_SECONDS:-1}
      TASK_WORKER_RETRY_BACKOFF_MAX_SECONDS: ${TASK_WORKER_RETRY_BACKOFF_MAX_SECONDS:-10}
      TASK_AUTH_DATABASE_URL: ${TASK_AUTH_DATABASE_URL:-postgresql+psycopg://auth_user:auth_password@auth-db:5432/auth_db}
      TASK_AUDIT_REPORT_PATH: ${TASK_AUDIT_REPORT_PATH:-/app/reports/audit_report.csv}
      TASK_AUDIT_REPORT_INTERVAL_SECONDS: ${TASK_AUDIT_REPORT_INTERVAL_SECONDS:-3600}
    depends_on:
      task-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-db:
        condition: service_healthy
      task-service:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports

  audit-report-cron:
    build:
      context: .
      dockerfile: services/audit_service/Dockerfile
    command: ["python", "-m", "services.audit_service.app.report_cron"]
    environment:
      TASK_DATABASE_URL: postgresql+psycopg://task_user:task_password@task-db:5432/task_db
      TASK_AUTH_DATABASE_URL: ${TASK_AUTH_DATABASE_URL:-postgresql+psycopg://auth_user:auth_password@auth-db:5432/auth_db}
      TASK_JWT_SECRET: ${JWT_SHARED_SECRET:-change-me-in-production}
      TASK_AUDIT_REPORT_PATH: ${TASK_AUDIT_REPORT_PATH:-/app/reports/audit_report.csv}
      TASK_AUDIT_REPORT_INTERVAL_SECONDS: ${TASK_AUDIT_REPORT_INTERVAL_SECONDS:-3600}
    depends_on:
      auth-db:
        condition: service_healthy
      task-db:
        condition: service_healthy
      task-service:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      auth-service:
        condition: service_started
      task-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  auth_data:
  task_data:
  rabbitmq_data:
  redis_data:
