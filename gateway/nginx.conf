server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    set $auth_upstream http://auth-service:8001;
    set $task_upstream http://task-service:8002;
    set $frontend_upstream http://frontend:8080;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /api/v1/health/auth {
        proxy_pass $auth_upstream/readiness;
    }

    location = /api/v1/health/task {
        proxy_pass $task_upstream/readiness;
    }

    location ^~ /api/v1/auth/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
    }

    location ^~ /api/v1/users {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
    }

    location ^~ /api/v1/teams {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
    }

    location ^~ /api/v1/tasks {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass $task_upstream;
    }

    location ^~ /api/v1/audit {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass $task_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
    }
}